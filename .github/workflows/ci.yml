name: Go CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 2

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'
        cache: true

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: |
        go build -v ./cmd/api-gateway/...
        # Add other service builds if needed

    - name: Test
      run: docker run --rm -v "$PWD:/src" -w /src golang:1.25 go test ./...

    - name: Validate Docker Compose
      run: docker compose config --quiet

    - name: Check whitespace
      run: git diff --check HEAD^ HEAD

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2
        args: --timeout=5m
        
    # Optional: Docker build step to prove containerization knowledge
    - name: Build Docker Image
      run: docker build -t atlaspay-api .

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v3

    - name: Start backend stack
      run: docker compose up -d --build postgres redis zookeeper kafka api-gateway

    - name: Wait for backend health
      shell: pwsh
      run: |
        for ($attempt = 1; $attempt -le 30; $attempt++) {
          try {
            $health = Invoke-RestMethod http://localhost:8080/health
            if ($health.status -eq "healthy") { exit 0 }
          } catch {}
          Start-Sleep -Seconds 2
        }
        throw "Backend did not become healthy after 60 seconds"

    - name: Run DLQ smoke workflow
      shell: pwsh
      run: ./scripts/dlq-smoke.ps1 | Tee-Object -FilePath dlq-smoke.log

    - name: Run checkout smoke workflow
      shell: pwsh
      run: ./scripts/demo-smoke.ps1 | Tee-Object -FilePath demo-smoke.log

    - name: Verify Kafka publish and consume logs
      run: |
        docker compose logs api-gateway > api-gateway.log
        SUCCESS_ID=$(sed -n 's/^Successful order: \([^,]*\).*/\1/p' demo-smoke.log)
        FAILED_ID=$(sed -n 's/^Failed order: \([^,]*\).*/\1/p' demo-smoke.log)
        test -n "$SUCCESS_ID"
        test -n "$FAILED_ID"
        for ORDER_ID in "$SUCCESS_ID" "$FAILED_ID"; do
          grep "$ORDER_ID" api-gateway.log | grep -q 'event published'
          grep "$ORDER_ID" api-gateway.log | grep -q 'event processed'
        done

    - name: Capture backend logs on failure
      if: failure()
      run: docker compose logs --no-color api-gateway kafka > compose-failure.log

    - name: Upload backend logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: compose-failure-logs
        path: |
          compose-failure.log
          dlq-smoke.log
          demo-smoke.log

    - name: Stop backend stack
      if: always()
      run: docker compose down -v
