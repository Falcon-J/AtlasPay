name: AtlasPay CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check committed whitespace
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git show --check --format= --no-ext-diff HEAD
          fi
      - name: Verify Go modules
        run: docker run --rm -v "$PWD:/src" -w /src golang:1.25 go mod verify

      - name: Build API gateway
        run: docker run --rm -v "$PWD:/src" -w /src golang:1.25 go build -buildvcs=false -v ./cmd/api-gateway/...

      - name: Run Go tests
        run: docker run --rm -v "$PWD:/src" -w /src golang:1.25 go test -buildvcs=false ./...

      - name: Validate Docker Compose
        run: docker compose config --quiet

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Start backend infrastructure
        run: docker compose up -d --wait postgres redis zookeeper kafka

      - name: Provision Kafka topics
        run: |
          for TOPIC in atlaspay.orders atlaspay.dlq; do
            docker compose exec -T kafka kafka-topics \
              --bootstrap-server localhost:9092 \
              --create \
              --if-not-exists \
              --topic "$TOPIC" \
              --partitions $([ "$TOPIC" = "atlaspay.orders" ] && echo 16 || echo 1) \
              --replication-factor 1
          done

      - name: Start application processes
        run: docker compose up -d --build payment-service inventory-service order-service api-gateway

      - name: Wait for backend health
        shell: bash
        run: |
          for i in {1..45}; do
            if curl -fsS http://localhost:8080/health; then
              exit 0
            fi
            sleep 2
          done

          echo "Backend did not become healthy."
          docker compose ps
          docker compose logs --no-color --tail=300 api-gateway postgres redis kafka zookeeper
          exit 1

      - name: Run payment service contract smoke workflow
        shell: pwsh
        run: |
          ./scripts/payment-service-contract-smoke.ps1 *>&1 | Tee-Object -FilePath payment-service-contract-smoke.log
          if (!(Test-Path payment-service-contract-smoke.log)) {
            throw "payment-service-contract-smoke.log was not created"
          }

      - name: Run inventory service contract smoke workflow
        shell: pwsh
        run: |
          ./scripts/inventory-service-contract-smoke.ps1 *>&1 | Tee-Object -FilePath inventory-service-contract-smoke.log
          if (!(Test-Path inventory-service-contract-smoke.log)) {
            throw "inventory-service-contract-smoke.log was not created"
          }

      - name: Run order service contract smoke workflow
        shell: pwsh
        run: |
          ./scripts/order-service-contract-smoke.ps1 *>&1 | Tee-Object -FilePath order-service-contract-smoke.log
          if (!(Test-Path order-service-contract-smoke.log)) {
            throw "order-service-contract-smoke.log was not created"
          }

      - name: Run saga claim integration test
        shell: bash
        run: |
          docker build --target builder -t atlaspay-order-test -f Dockerfile.order .
          NETWORK=$(docker network ls --filter label=com.docker.compose.network=atlaspay-network --format '{{.ID}}' | head -n 1)
          test -n "$NETWORK"
          docker run --rm --network "$NETWORK" \
            -e ATLASPAY_INTEGRATION=1 \
            -w /app \
            atlaspay-order-test \
            go test -buildvcs=false ./internal/order -run TestRepositoryClaimSagaLease -count=1 -v \
            2>&1 | tee saga-claim-integration.log

      - name: Run DLQ smoke workflow
        shell: pwsh
        run: |
          ./scripts/dlq-smoke.ps1 *>&1 | Tee-Object -FilePath dlq-smoke.log
          if (!(Test-Path dlq-smoke.log)) {
            throw "dlq-smoke.log was not created"
          }

      - name: Run checkout smoke workflow
        shell: pwsh
        run: |
          ./scripts/demo-smoke.ps1 *>&1 | Tee-Object -FilePath demo-smoke.log
          if (!(Test-Path demo-smoke.log)) {
            throw "demo-smoke.log was not created"
          }
          Get-Content demo-smoke.log

      - name: Run duplicate-event smoke workflow
        shell: pwsh
        run: |
          ./scripts/duplicate-event-smoke.ps1 *>&1 | Tee-Object -FilePath duplicate-event-smoke.log
          if (!(Test-Path duplicate-event-smoke.log)) {
            throw "duplicate-event-smoke.log was not created"
          }
          Get-Content duplicate-event-smoke.log

      - name: Run outbox recovery smoke workflow
        shell: pwsh
        run: |
          ./scripts/outbox-recovery-smoke.ps1 *>&1 | Tee-Object -FilePath outbox-recovery-smoke.log
          if (!(Test-Path outbox-recovery-smoke.log)) {
            throw "outbox-recovery-smoke.log was not created"
          }
          Get-Content outbox-recovery-smoke.log

      - name: Run saga restart smoke workflow
        shell: pwsh
        run: |
          ./scripts/saga-restart-smoke.ps1 *>&1 | Tee-Object -FilePath saga-restart-smoke.log
          if (!(Test-Path saga-restart-smoke.log)) {
            throw "saga-restart-smoke.log was not created"
          }
          Get-Content saga-restart-smoke.log

      - name: Run saga crash-replay smoke workflow
        shell: pwsh
        run: |
          ./scripts/saga-crash-replay-smoke.ps1 *>&1 | Tee-Object -FilePath saga-crash-replay-smoke.log
          if (!(Test-Path saga-crash-replay-smoke.log)) {
            throw "saga-crash-replay-smoke.log was not created"
          }
          Get-Content saga-crash-replay-smoke.log

      - name: Capture backend logs
        if: always()
        shell: bash
        run: |
          docker compose logs --no-color api-gateway order-service payment-service inventory-service kafka zookeeper > backend.log || true
          docker compose ps > compose-ps.log || true

      - name: Verify Kafka publish and consume logs
        shell: bash
        run: |
          echo "Files in workspace:"
          ls -la

          echo "demo-smoke.log:"
          cat demo-smoke.log

          SUCCESS_ID=$(grep -Eo 'Successful order: [0-9a-fA-F-]+' demo-smoke.log | awk '{print $3}' | tr -d '\r')
          FAILED_ID=$(grep -Eo 'Failed order: [0-9a-fA-F-]+' demo-smoke.log | awk '{print $3}' | tr -d '\r')

          echo "SUCCESS_ID=$SUCCESS_ID"
          echo "FAILED_ID=$FAILED_ID"

          test -n "$SUCCESS_ID"
          test -n "$FAILED_ID"

          for ORDER_ID in "$SUCCESS_ID" "$FAILED_ID"; do
            grep "$ORDER_ID" backend.log | grep -q 'event published'
            grep "$ORDER_ID" backend.log | grep -q 'event processed'
          done

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-failure-logs
          path: |
            backend.log
            compose-ps.log
            dlq-smoke.log
            payment-service-contract-smoke.log
            inventory-service-contract-smoke.log
            order-service-contract-smoke.log
            saga-claim-integration.log
            demo-smoke.log
            duplicate-event-smoke.log
            outbox-recovery-smoke.log
            saga-restart-smoke.log
            saga-crash-replay-smoke.log

      - name: Stop backend stack
        if: always()
        run: docker compose down -v
