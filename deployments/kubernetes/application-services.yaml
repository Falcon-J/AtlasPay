  template:
    metadata:
      labels:
        app: order-service
        tier: backend
    spec:
      containers:
      - name: order-service
        image: atlaspay/order-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8083
        env:
        - name: ORDER_SERVICE_PORT
          value: "8083"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: atlaspay-config
              key: db_host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: atlaspay-config
              key: db_port
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: atlaspay-secrets
              key: db_user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: atlaspay-secrets
              key: db_password
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: atlaspay-config
              key: db_name
        - name: DB_SSLMODE
          valueFrom:
            configMapKeyRef:
              name: atlaspay-config
              key: db_sslmode
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: atlaspay-config
              key: redis_host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: atlaspay-config
              key: redis_port
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: atlaspay-config
              key: kafka_brokers
        - name: KAFKA_ENABLED
          value: "true"
        - name: KAFKA_GROUP_ID
          valueFrom:
            configMapKeyRef:
              name: atlaspay-config
              key: kafka_group_id
        - name: KAFKA_WORKERS
          valueFrom:
            configMapKeyRef:
              name: atlaspay-config
              key: kafka_workers
        - name: PAYMENT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: atlaspay-config
              key: payment_service_url
        - name: PAYMENT_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: atlaspay-secrets
              key: payment_service_token
        - name: INVENTORY_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: atlaspay-config
              key: inventory_service_url
        - name: INVENTORY_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: atlaspay-secrets
              key: inventory_service_token
        - name: ORDER_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: atlaspay-secrets
              key: order_service_token
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
