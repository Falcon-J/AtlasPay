<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtlasPay | Black Friday Console Drop</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --surface: #111111;
            --border: #222222;
            --text: #ffffff;
            --muted: #888888;
            --primary: #0070f3;
            --success: #00e676;
            --danger: #ff1744;
            --warning: #ffea00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            padding: 20px 40px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17, 17, 17, 0.8);
            backdrop-filter: blur(10px);
        }

        .logo { font-weight: 800; font-size: 1.2rem; letter-spacing: -0.05em; }
        .score-board { display: flex; gap: 20px; font-weight: 600; }
        .score-board span { color: var(--success); }

        /* Main Game Area */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 0;
        }

        .game-panel {
            padding: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, var(--bg) 100%);
        }

        .product-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
            transition: transform 0.1s ease;
        }

        .product-image {
            width: 160px;
            height: 160px;
            background: linear-gradient(135deg, #333, #111);
            border-radius: 20px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            border: 1px solid var(--border);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        h1 { font-size: 2rem; margin-bottom: 10px; font-weight: 800; letter-spacing: -0.03em; }
        .price { font-size: 1.2rem; color: var(--muted); margin-bottom: 30px; }
        
        .inventory {
            font-size: 3rem;
            font-weight: 800;
            color: var(--warning);
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(255, 234, 0, 0.2);
        }

        .buy-btn {
            background: var(--text);
            color: var(--bg);
            border: none;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .buy-btn:active { transform: scale(0.96); }
        .buy-btn:disabled { background: var(--muted); cursor: not-allowed; transform: none; }

        /* Sidebar Log */
        .sidebar {
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .toggles {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Switch UI */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--border);
            transition: .3s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        .log-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            background: #000;
        }

        .log-entry {
            margin-bottom: 10px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .log-time { color: var(--muted); margin-right: 8px; }
        .log-success { color: var(--success); }
        .log-fail { color: var(--danger); }
        .log-info { color: var(--primary); }
        .log-warn { color: var(--warning); }

    </style>
</head>
<body>

    <header>
        <div class="logo">AtlasPay Mini-Game</div>
        <div class="score-board">
            <div>Auth: <span id="auth-status" style="color:var(--muted)">Connecting...</span></div>
            <div>Score: <span id="score">0</span></div>
        </div>
    </header>

    <main>
        <div class="game-panel">
            <div class="product-card" id="card">
                <div class="product-image">🎮</div>
                <h1>Atlas Console</h1>
                <div class="price">$499.00 USD</div>
                
                <div style="font-size: 0.9rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px;">Stock Remaining</div>
                <div class="inventory" id="inventory">500</div>
                
                <button class="buy-btn" id="buy-btn" onclick="buyConsole()">MASH TO BUY</button>
                <div style="margin-top: 15px; font-size: 0.8rem; color: var(--muted);">Spam click to test Idempotency!</div>
            </div>
        </div>

        <div class="sidebar">
            <div class="toggles">
                <div class="toggle-row">
                    <span>🤖 AI Bot Competitors</span>
                    <label class="switch">
                        <input type="checkbox" id="bot-toggle" onchange="toggleBots()">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-row">
                    <span>💥 Network Glitch (Fails Payment)</span>
                    <label class="switch">
                        <input type="checkbox" id="glitch-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            
            <div class="log-container" id="terminal">
                <div class="log-entry"><span class="log-time">[SYSTEM]</span><span class="log-info">Backend initialized. Ready for drop.</span></div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = window.location.origin;
        let jwtToken = null;
        let inventoryCount = 500;
        let score = 0;
        let botInterval = null;

        const terminal = document.getElementById('terminal');
        const inventoryEl = document.getElementById('inventory');
        const scoreEl = document.getElementById('score');

        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString([], {hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit', fractionalSecondDigits: 2});
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `<span class="log-time">[${time}]</span><span class="log-${type}">${message}</span>`;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function initAuth() {
            const email = `gamer-${Date.now()}@atlaspay.local`;
            const pass = "Password123";
            
            log(`Registering session for ${email}...`, 'info');
            
            try {
                // Register
                await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: email, password: pass, name: "Gamer"})
                });

                // Login
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: email, password: pass})
                });
                
                const data = await res.json();
                if(data && data.data && data.data.access_token) {
                    jwtToken = data.data.access_token;
                    document.getElementById('auth-status').textContent = 'Online';
                    document.getElementById('auth-status').style.color = 'var(--success)';
                    log("Connected to API Gateway. JWT secured.", 'success');
                } else {
                    throw new Error("Failed to get token");
                }
            } catch (err) {
                log("Backend connection failed. Is Docker running?", 'fail');
            }
        }

        async function buyConsole(isBot = false) {
            if(!jwtToken || inventoryCount <= 0) return;

            const isGlitch = document.getElementById('glitch-toggle').checked;
            const sku = isGlitch ? 'FAIL-PAYMENT-001' : 'CONSOLE-X';
            
            // Random idempotency key (1 per click, prevents double charge if retried)
            const idemKey = `idem-${Date.now()}-${Math.floor(Math.random()*1000)}`;

            if(!isBot) {
                document.getElementById('card').style.transform = 'scale(0.98)';
                setTimeout(() => document.getElementById('card').style.transform = 'none', 100);
            }

            try {
                // Instantly decrement for visual feel, if it fails we rollback visually too
                inventoryCount--;
                updateCounters();
                
                const res = await fetch(`${API_BASE}/api/orders`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${jwtToken}`
                    },
                    body: JSON.stringify({
                        customer_id: isBot ? 'bot' : 'player',
                        items: [{ product_id: sku, quantity: 1, unit_price: 499.00 }],
                        payment_method: 'credit_card',
                        idempotency_key: idemKey
                    })
                });

                const data = await res.json();
                const orderId = data?.data?.id;

                if(res.ok && orderId) {
                    const prefix = isBot ? "[BOT] " : "[YOU] ";
                    log(`${prefix}Order ${orderId.slice(-6)}: Created`, 'info');
                    
                    if(isGlitch) {
                        log(`${prefix}Order ${orderId.slice(-6)}: SAGA - Payment Failed!`, 'fail');
                        log(`${prefix}Order ${orderId.slice(-6)}: SAGA - Inventory Rollback`, 'warn');
                        // Rollback visual inventory
                        inventoryCount++;
                        updateCounters();
                    } else {
                        log(`${prefix}Order ${orderId.slice(-6)}: Payment Processed`, 'success');
                        if(!isBot) {
                            score++;
                            updateCounters();
                        }
                    }
                }
            } catch (e) {
                inventoryCount++; // Rollback on network crash
                updateCounters();
                log("Network error", 'fail');
            }
        }

        function toggleBots() {
            const enabled = document.getElementById('bot-toggle').checked;
            if(enabled) {
                log("AI Bots activated. They are buying stock fast!", 'warn');
                botInterval = setInterval(() => {
                    buyConsole(true);
                }, 400); // Bots buy every 400ms
            } else {
                log("AI Bots deactivated.", 'info');
                clearInterval(botInterval);
            }
        }

        function updateCounters() {
            inventoryEl.textContent = inventoryCount;
            scoreEl.textContent = score;
            if(inventoryCount <= 0) {
                inventoryEl.textContent = "SOLD OUT";
                inventoryEl.style.color = "var(--danger)";
                document.getElementById('buy-btn').disabled = true;
                if(botInterval) clearInterval(botInterval);
                log("Inventory depleted. Drop over.", 'fail');
            }
        }

        // Boot
        initAuth();

    </script>
</body>
</html>
