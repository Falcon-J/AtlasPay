<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtlasPay | Saga Tycoon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --surface: #111111;
            --border: #222222;
            --text: #ffffff;
            --muted: #888888;
            --primary: #0070f3;
            --success: #00e676;
            --danger: #ff1744;
            --warning: #ffea00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            padding: 20px 40px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17, 17, 17, 0.8);
        }

        .logo { font-weight: 800; font-size: 1.2rem; }
        .score-board { display: flex; gap: 30px; font-weight: 600; font-size: 1.2rem; }
        .score-board span { color: var(--success); }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            gap: 40px;
        }

        /* Visualizer Pipeline */
        .pipeline-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            position: relative;
            width: 100%;
            max-width: 800px;
        }

        .node {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            width: 200px;
            text-align: center;
            position: relative;
            z-index: 2;
            transition: all 0.3s ease;
        }
        .node h2 { font-size: 1.2rem; margin-bottom: 10px; }
        .node p { font-family: 'JetBrains Mono'; font-size: 0.9rem; color: var(--muted); }

        .node.active {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 112, 243, 0.3);
            transform: scale(1.05);
        }
        .node.success {
            border-color: var(--success);
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.3);
        }
        .node.error {
            border-color: var(--danger);
            box-shadow: 0 0 20px rgba(255, 23, 68, 0.3);
            animation: shake 0.4s ease-in-out;
        }

        .connector {
            flex: 1;
            height: 4px;
            background: var(--border);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .packet {
            position: absolute;
            top: -3px;
            left: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0;
            box-shadow: 0 0 10px var(--primary);
        }

        @keyframes packetMoveForward {
            0% { left: 0; opacity: 1; }
            100% { left: 100%; opacity: 1; }
        }
        @keyframes packetMoveBackward {
            0% { left: 100%; opacity: 1; background: var(--danger); box-shadow: 0 0 10px var(--danger); }
            100% { left: 0; opacity: 1; background: var(--danger); box-shadow: 0 0 10px var(--danger); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 20px;
            background: var(--surface);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 800px;
            justify-content: space-between;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex: 1;
        }

        button {
            background: var(--text);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-restock { background: var(--primary); color: white; }
        
        .toggles {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Switch */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border); transition: .2s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: var(--muted); transition: .2s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); background-color: white; }
        input.glitch:checked + .slider { background-color: var(--danger); }

        #terminal {
            width: 100%;
            max-width: 800px;
            background: #0a0a0a;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            height: 200px;
            overflow-y: auto;
            color: var(--muted);
        }
        .log-info { color: var(--primary); }
        .log-success { color: var(--success); }
        .log-warn { color: var(--warning); }
        .log-fail { color: var(--danger); }
    </style>
</head>
<body>

    <header>
        <div class="logo">AtlasPay Saga Tycoon</div>
        <div class="score-board">
            <div>Revenue: $<span id="revenue-el">0</span></div>
            <div>Inventory: <span id="inventory-el" style="color: var(--warning);">10</span></div>
        </div>
    </header>

    <main>
        <div class="pipeline-container">
            <div class="node" id="node-order">
                <h2>1. Order API</h2>
                <p>Creates Order</p>
            </div>
            
            <div class="connector">
                <div class="packet" id="packet-1"></div>
            </div>

            <div class="node" id="node-inventory">
                <h2>2. Inventory</h2>
                <p>Reserves Stock</p>
            </div>

            <div class="connector">
                <div class="packet" id="packet-2"></div>
            </div>

            <div class="node" id="node-payment">
                <h2>3. Payment</h2>
                <p>Charges Card</p>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <h3>Store Management</h3>
                <button class="btn-restock" onclick="restock()">📦 Buy Wholesale (10 Consoles) - $500</button>
                <button onclick="buyConsole(false)">🛒 Sell 1 Console (Manual)</button>
            </div>
            <div class="control-group">
                <h3>System Simulation</h3>
                <div class="toggles">
                    <div class="toggle-row">
                        <span>🤖 AI Shopper Bots (Auto-Buy)</span>
                        <label class="switch">
                            <input type="checkbox" id="bot-toggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="toggle-row">
                        <span style="color: var(--danger);">⚡ Inject Payment Glitch</span>
                        <label class="switch">
                            <input type="checkbox" id="glitch-toggle" class="glitch">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div id="terminal">
            <div>[System] Initializing Tycoon Dashboard...</div>
        </div>
    </main>

    <script>
        const isLocalHost = window.location.port === '5500' || window.location.port === '5501' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const isFileProtocol = window.location.protocol === 'file:';
        const API_BASE = (isLocalHost || isFileProtocol) ? 'http://localhost:8080' : window.location.origin;
        
        let jwtToken = null;
        let inventoryCount = 10;
        let revenue = 0;
        let isProcessing = false; // Prevent overlapping animations for clarity

        const term = document.getElementById('terminal');
        function log(msg, type='info') {
            const div = document.createElement('div');
            div.className = `log-${type}`;
            div.textContent = msg;
            term.appendChild(div);
            term.scrollTop = term.scrollHeight;
        }

        async function init() {
            try {
                // Anonymous Tycoon Login
                const email = `tycoon-${Date.now()}@atlaspay.local`;
                const pass = "Password123";

                await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password: pass, first_name: "Store", last_name: "Owner" })
                });

                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password: pass })
                });
                const data = await res.json();
                if(data?.data?.access_token) {
                    jwtToken = data.data.access_token;
                    log("[System] Connected to Backend. Store is open!", 'success');
                    updateUI();
                }
            } catch(e) {
                log("[System] Backend unreachable. Make sure Docker is running.", 'fail');
            }
        }

        function updateUI() {
            document.getElementById('inventory-el').textContent = inventoryCount;
            document.getElementById('revenue-el').textContent = revenue;
        }

        // Delay helper
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        // Saga Visualizer Animation
        async function runSagaAnimation(isGlitch) {
            isProcessing = true;
            const nOrder = document.getElementById('node-order');
            const nInv = document.getElementById('node-inventory');
            const nPay = document.getElementById('node-payment');
            const p1 = document.getElementById('packet-1');
            const p2 = document.getElementById('packet-2');

            // Reset
            [nOrder, nInv, nPay].forEach(n => n.className = 'node');

            // Step 1: Order
            nOrder.classList.add('active');
            log("SAGA: Order Created", 'info');
            await sleep(400);

            // Step 2: Packet to Inventory
            p1.style.animation = "packetMoveForward 0.6s linear forwards";
            await sleep(600);
            p1.style.animation = "none";
            nOrder.classList.remove('active');
            nInv.classList.add('active');
            log("SAGA: Inventory Reserved", 'info');
            await sleep(400);

            // Step 3: Packet to Payment
            p2.style.animation = "packetMoveForward 0.6s linear forwards";
            await sleep(600);
            p2.style.animation = "none";
            nInv.classList.remove('active');

            if (isGlitch) {
                nPay.classList.add('error');
                log("SAGA: Payment FAILED (Network Glitch)", 'fail');
                await sleep(800);
                
                // Rollback Phase
                log("SAGA: Triggering Compensation...", 'warn');
                p2.style.animation = "packetMoveBackward 0.6s linear forwards";
                await sleep(600);
                p2.style.animation = "none";
                nPay.classList.remove('error');
                
                nInv.classList.add('active');
                log("SAGA: Inventory Released (Rollback)", 'warn');
                await sleep(600);
                nInv.classList.remove('active');

            } else {
                nPay.classList.add('success');
                log("SAGA: Payment Processed", 'success');
                await sleep(800);
                nPay.classList.remove('success');
            }

            isProcessing = false;
        }

        async function buyConsole(isBot = false) {
            if(!jwtToken || inventoryCount <= 0 || isProcessing) return;

            const isGlitch = document.getElementById('glitch-toggle').checked;
            const sku = isGlitch ? 'FAIL-PAYMENT-001' : 'CONSOLE-X';
            
            // Visual deduct
            inventoryCount--;
            updateUI();

            // Run visual animation asynchronously so we don't block
            runSagaAnimation(isGlitch);

            try {
                const res = await fetch(`${API_BASE}/api/orders`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${jwtToken}`
                    },
                    body: JSON.stringify({
                        items: [{ sku: sku, quantity: 1 }]
                    })
                });

                if (res.ok && !isGlitch) {
                    revenue += 499;
                    updateUI();
                } else if (isGlitch) {
                    // Rollback visual
                    inventoryCount++;
                    updateUI();
                }
            } catch(e) {
                inventoryCount++;
                updateUI();
            }
        }

        async function restock() {
            if(!jwtToken || revenue < 500) {
                log("[Tycoon] Not enough revenue to buy wholesale stock! Need $500.", "fail");
                return;
            }

            try {
                revenue -= 500;
                updateUI();

                await fetch(`${API_BASE}/api/inventory/restock`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${jwtToken}`
                    },
                    body: JSON.stringify({ sku: 'CONSOLE-X', quantity: 10 })
                });

                inventoryCount += 10;
                updateUI();
                log("[Tycoon] Restocked 10 Consoles!", "success");
            } catch(e) {
                log("[Tycoon] Restock failed.", "fail");
            }
        }

        // Bot Logic
        setInterval(() => {
            if(document.getElementById('bot-toggle').checked) {
                if (inventoryCount > 0 && !isProcessing) {
                    buyConsole(true);
                }
            }
        }, 3000);

        init();
    </script>
</body>
</html>
